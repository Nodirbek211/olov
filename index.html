<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Olov</title>
<style>
:root{--bg:#0b0b10;--card:#15151d;--line:#272735;--tx:#f2f2f7;--mut:#8b8b9e;--fire:#ff7a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px}
.top h1{font-size:20px;margin:0}
.tools{display:flex;align-items:center;gap:8px}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.note{color:var(--mut);font-size:12px}

/* olov */
.stage{position:relative;height:320px;margin-top:4px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{text-align:center;margin:2px 0 18px}
.info b{font-size:22px}
.info div{color:var(--mut);font-size:14px;margin-top:4px}

/* odatlar */
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.sel{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 0}
.sel b{font-size:16px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:8px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);color:inherit;font-size:16px;text-align:left;cursor:pointer;
  transition:background .2s,border-color .2s}
.item .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #44445a;display:grid;place-items:center;font-size:14px;color:transparent}
.item.done{background:#2a1a0e;border-color:var(--fire)}
.item.done .ck{background:var(--fire);border-color:var(--fire);color:#1a0d02}
.item.done span:last-child{color:#ffd9b8}
.item:disabled{cursor:default;opacity:.6}
.finish{display:block;width:100%;margin-top:18px;padding:16px;border-radius:14px;border:0;background:var(--fire);color:#1a0d02;font-size:17px;font-weight:700;cursor:pointer}
.finish:disabled{background:var(--card);color:var(--mut);border:1px solid var(--line);cursor:default}

/* kalendar */
.cal{margin-top:26px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead b{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-size:11px;color:var(--mut)}
.day{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:13px;cursor:pointer;padding:0}
.day.full{background:var(--fire);color:#1a0d02;font-weight:700;border-color:var(--fire)}
.day.today{outline:2px solid #fff3}
.day.sel{outline:2px solid #fff}
.day.future{opacity:.3;cursor:default}
.day.empty{visibility:hidden}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🔥 Olov</h1>
    <div class="tools">
      <button class="btn" id="snd" title="Ovoz">🔊</button>
      <div id="auth"></div>
    </div>
  </div>

  <div class="stage" id="stage"><canvas id="fire"></canvas></div>
  <div class="info">
    <b id="msg"></b>
    <div id="cnt"></div>
  </div>

  <div class="sel"><b id="selLabel"></b><span class="note" id="selNote"></span></div>
  <div id="list"></div>

  <div class="cal">
    <div class="calhead">
      <button class="btn" id="prev">‹</button>
      <b id="calTitle"></b>
      <button class="btn" id="next">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
/* ============ SOZLAMA ============
   Firebase'ni ulash uchun (Google bilan kirish + telefon/noutbuk sinxroni)
   shu yerga Firebase beradigan sozlamani qo'y. Bo'sh qolsa, sayt faqat
   shu qurilmaning brauzerida saqlaydi.

   Firestore qoidalari (Rules) shunday bo'lishi kerak:
   rules_version = '2';
   service cloud.firestore { match /databases/{db}/documents {
     match /users/{uid} { allow read, write: if request.auth != null && request.auth.uid == uid; }
   } }
*/
const FB_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};

/* ============ ODATLAR ============ */
const HABITS = [
  { g: "Ertalab", items: [
    ["wake", "O'z vaqtida turish"], ["bed", "To'shakni yig'ish"], ["face", "Betni yuvish"],
    ["teeth", "Tish yuvish"], ["water", "Bir stakan suv ichish"], ["push", "Otjimaniya"], ["abs", "Press"] ] },
  { g: "Kunduzi", items: [
    ["hw", "Uy vazifasi"], ["word", "Yangi so'z yodlash"], ["veg", "Sabzavot yeyish"],
    ["walk", "10 daqiqa piyoda yurish"], ["read", "5 daqiqa kitob o'qish"], ["dish", "Ovqatdan keyin idish-tovoq yuvish"] ] },
  { g: "Kechqurun", items: [
    ["socks", "Paypoqni yuvish"], ["clothes", "Ertangi kiyimni tayyorlash"], ["hair", "Soch va tirnoq parvarishi (haftada 2 marta)"] ] }
];
const N = HABITS.reduce((a, g) => a + g.items.length, 0);
const DECAY = 0.75; // o'tkazib yuborilgan har kunda olov shu ulushgacha pasayadi
const MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
const WD = ["Du","Se","Ch","Pa","Ju","Sh","Ya"];
const LS = "olov-v1";

/* ============ SANA ============ */
const pad = n => String(n).padStart(2, "0");
const fmt = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => fmt(new Date());

/* ============ HOLAT ============ */
let state = { done: {} };
try { const raw = localStorage.getItem(LS); if (raw) state = JSON.parse(raw); } catch (e) {}
if (!state.done) state.done = {};
if (!state.closed) state.closed = {};
let sel = todayKey();
let lastToday = sel;
let view = parseKey(sel); view.setDate(1);
let fbUser = null, db = null, auth = null, unsub = null;

const cnt = k => (state.done[k] || []).length;
function persistLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

const isLocked = k => k < todayKey() || !!state.closed[k];
function toggle(id) {
  if (isLocked(sel)) return;
  const arr = (state.done[sel] || []).slice();
  const i = arr.indexOf(id);
  const marking = i < 0;
  if (marking) arr.push(id); else arr.splice(i, 1);
  state.done[sel] = arr;
  persistLocal();
  if (fbUser && db) {
    db.collection("users").doc(fbUser.uid).set({ done: { [sel]: arr } }, { merge: true }).catch(() => {});
  }
  render();
  if (marking) burst();
}

function finishDay() {
  const t = todayKey();
  if (state.closed[t]) return;
  if (!confirm("Kunni tugatasanmi? Keyin bugungi belgilarni o'zgartirib bo'lmaydi.")) return;
  state.closed[t] = true;
  persistLocal();
  if (fbUser && db) {
    db.collection("users").doc(fbUser.uid).set({ closed: { [t]: true } }, { merge: true }).catch(() => {});
  }
  render();
}

/* ============ OLOV MANTIG'I ============ */
function heatFor(t) {
  const keys = Object.keys(state.done).filter(k => cnt(k) && k <= t).sort();
  if (!keys.length) return 0;
  let d = parseKey(keys[0]), H = 0;
  const end = parseKey(t);
  while (d <= end) {
    H = Math.max(cnt(fmt(d)), H * DECAY);
    d.setDate(d.getDate() + 1);
  }
  return H;
}
function streak(t) {
  let d = parseKey(t);
  if (!cnt(t)) d.setDate(d.getDate() - 1);
  let c = 0;
  while (cnt(fmt(d))) { c++; d.setDate(d.getDate() - 1); }
  return c;
}

/* ============ OLOV RASMI (zarrachalar) ============ */
const canvas = document.getElementById("fire");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// rang yo'li: oq-sariq -> sariq -> to'q sariq -> qizil -> qoramtir
const RAMP = [[255,245,190],[255,205,80],[255,125,28],[225,58,16],[90,18,10]];
function rampColor(t) {
  const x = Math.min(0.999, t) * (RAMP.length - 1), i = Math.floor(x), f = x - i;
  return RAMP[i].map((v, j) => Math.round(v + (RAMP[i + 1][j] - v) * f));
}
const NS = 20, SPR = [];
for (let i = 0; i < NS; i++) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), [r, gg, b] = rampColor(i / (NS - 1));
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${r},${gg},${b},1)`);
  gr.addColorStop(0.4, `rgba(${r},${gg},${b},.55)`);
  gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  SPR.push(c);
}

let parts = [], embers = [], flameLvl = 0, flameTarget = 0, lastT = performance.now(), acc = 0, embAcc = 0, T = 0, lastSnd = 0;

function spawn(l) {
  const spread = 5 + l * 75;
  parts.push({
    x0: (Math.random() + Math.random() - 1) * spread,
    y: 0, age: 0,
    life: (0.4 + l * 0.6) * (0.7 + Math.random() * 0.6),
    size: (9 + l * 30) * (0.7 + Math.random() * 0.6),
    vy: (50 + l * 120) * (0.75 + Math.random() * 0.5),
    ph: Math.random() * 6.28, fr: 2 + Math.random() * 3, wob: 3 + l * 16
  });
}
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; T += dt;
  flameLvl += (flameTarget - flameLvl) * Math.min(1, dt * 3.2);
  const l = flameLvl, base = H - 14, cx = W / 2;
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";

  // yorug'lik
  const flick = 0.9 + 0.1 * Math.sin(T * 9) * Math.sin(T * 3.7);
  const gr = 40 + l * 190;
  const g = ctx.createRadialGradient(cx, base, 0, cx, base, gr);
  const ga = (0.08 + 0.32 * l) * flick;
  g.addColorStop(0, `rgba(255,120,30,${ga})`);
  g.addColorStop(1, "rgba(255,120,30,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // zarrachalar
  acc += (10 + l * 230) * dt * (0.85 + Math.random() * 0.3);
  while (acc >= 1) { spawn(l); acc--; }
  const sway = Math.sin(T * 1.3) * l * 10 + Math.sin(T * 0.7 + 1) * l * 6;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age += dt;
    const t = p.age / p.life;
    if (t >= 1) { parts.splice(i, 1); continue; }
    p.y += p.vy * dt * (1 + t * 0.4);
    const x = cx + p.x0 * (1 - t * 0.85) + Math.sin(T * p.fr + p.ph) * p.wob * t + sway * t;
    const y = base - p.y;
    const s = p.size * Math.pow(1 - t, 0.7);
    ctx.globalAlpha = Math.min(1, (1 - t) * 0.95);
    ctx.drawImage(SPR[Math.min(NS - 1, Math.floor(t * NS))], x - s, y - s, s * 2, s * 2);
  }

  // uchqunlar (kuchli olovda)
  if (l > 0.75) {
    embAcc += (l - 0.75) * 40 * dt;
    while (embAcc >= 1) {
      embers.push({ x: cx + (Math.random() - 0.5) * 90 * l, y: 30 + Math.random() * 40, vx: (Math.random() - 0.5) * 30,
        vy: 60 + Math.random() * 90, age: 0, life: 1.2 + Math.random() * 1.4, ph: Math.random() * 6 });
      embAcc--;
    }
  }
  ctx.fillStyle = "#ffb347";
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i]; e.age += dt;
    if (e.age >= e.life) { embers.splice(i, 1); continue; }
    e.y += e.vy * dt; e.x += (e.vx + Math.sin(T * 3 + e.ph) * 14) * dt;
    ctx.globalAlpha = 1 - e.age / e.life;
    ctx.beginPath(); ctx.arc(e.x, base - e.y, 1.6, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ovoz balandligini olovga moslash
  if (actx && master && now - lastSnd > 150) {
    lastSnd = now;
    const t0 = actx.currentTime;
    master.gain.setTargetAtTime(soundOn ? (0.05 + l * 0.8) * 0.7 : 0, t0, 0.15);
    rumbleG.gain.setTargetAtTime(l * 0.9, t0, 0.2);
    hissG.gain.setTargetAtTime(l * 0.07, t0, 0.2);
  }
  requestAnimationFrame(frame);
}

/* ============ OVOZ (yonayotgan olov) ============ */
let actx = null, master = null, rumbleG = null, hissG = null, wbuf = null, soundOn = true;
try { soundOn = localStorage.getItem(LS + "-snd") !== "off"; } catch (e) {}
function audioInit() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
  const sr = actx.sampleRate;
  // past gumburlash (jigarrang shovqin)
  const brown = actx.createBuffer(1, sr * 3, sr), bd = brown.getChannelData(0);
  let last = 0;
  for (let i = 0; i < bd.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; bd[i] = last * 3.5; }
  wbuf = actx.createBuffer(1, sr * 2, sr);
  const wd = wbuf.getChannelData(0);
  for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
  const rs = actx.createBufferSource(); rs.buffer = brown; rs.loop = true;
  const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
  rumbleG = actx.createGain(); rumbleG.gain.value = 0;
  rs.connect(lp); lp.connect(rumbleG); rumbleG.connect(master); rs.start();
  // sharpa (shshsh)
  const hs = actx.createBufferSource(); hs.buffer = wbuf; hs.loop = true;
  const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3000; bp.Q.value = 0.5;
  hissG = actx.createGain(); hissG.gain.value = 0;
  hs.connect(bp); bp.connect(hissG); hissG.connect(master); hs.start();
  scheduleCrackle();
}
function crackle(strength) {
  if (!actx || !soundOn || actx.state !== "running") return;
  const t = actx.currentTime, d = 0.008 + Math.random() * 0.05;
  const src = actx.createBufferSource(); src.buffer = wbuf;
  const bp = actx.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 700 + Math.random() * 3800; bp.Q.value = 0.8 + Math.random() * 3;
  const g = actx.createGain(), peak = (0.15 + Math.random() * 0.85) * strength;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t, Math.random() * 1.5, d + 0.02);
}
function scheduleCrackle() {
  crackle(0.4 + flameLvl * 0.9);
  if (Math.random() < 0.25) setTimeout(() => crackle(0.5 + flameLvl), 20 + Math.random() * 60);
  setTimeout(scheduleCrackle, (950 * (1 - flameLvl) + 60) * (0.25 + Math.random() * 1.5));
}
function burst() { // odat belgilanganda olov "gup" etadi
  if (!actx || !soundOn) return;
  for (let i = 0; i < 8; i++) setTimeout(() => crackle(1.2), i * 50);
}
const sndBtn = document.getElementById("snd");
function paintSnd() { sndBtn.textContent = soundOn ? "🔊" : "🔇"; }
paintSnd();
sndBtn.onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem(LS + "-snd", soundOn ? "on" : "off"); } catch (e) {}
  paintSnd();
  if (soundOn) { audioInit(); if (actx && actx.state !== "running") actx.resume(); }
};
// brauzerlar ovozni faqat foydalanuvchi bosgandan keyin ruxsat beradi
document.addEventListener("pointerdown", () => {
  if (!soundOn) return;
  audioInit();
  if (actx && actx.state !== "running") actx.resume();
});
document.addEventListener("visibilitychange", () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else if (soundOn) actx.resume();
});

/* ============ CHIZISH ============ */
function renderFire() {
  const t = todayKey();
  const L = Math.min(1, heatFor(t) / N);
  flameTarget = L;
  const n = cnt(t);
  let m;
  if (state.closed[t]) m = n === N ? "Yong'in! Kun to'liq tugadi 🔥" : "Kun tugadi. Ertaga davom etamiz";
  else if (n === N) m = "Yong'in! Hammasi bajarildi 🔥";
  else if (L === 0) m = "Uchqunni yoq!";
  else if (L < 0.34) m = "Olov yonib kelyapti";
  else if (L < 0.67) m = "Yaxshi, davom et";
  else m = "Alanga bo'lyapti!";
  document.getElementById("msg").textContent = m;
  document.getElementById("cnt").textContent = "Bugun " + n + "/" + N + "  ·  seriya: " + streak(t) + " kun";
}
function renderList() {
  const t = todayKey();
  const done = state.done[sel] || [];
  const d = parseKey(sel);
  document.getElementById("selLabel").textContent = sel === t ? "Bugun" : d.getDate() + "-" + MONTHS[d.getMonth()].toLowerCase();
  const locked = isLocked(sel);
  document.getElementById("selNote").textContent = sel !== t ? "o'tgan kun, o'zgartirib bo'lmaydi" : (locked ? "kun tugatilgan" : "");
  const box = document.getElementById("list");
  box.innerHTML = "";
  HABITS.forEach(g => {
    const h = document.createElement("h2"); h.textContent = g.g; box.appendChild(h);
    g.items.forEach(([id, name]) => {
      const b = document.createElement("button");
      b.className = "item" + (done.includes(id) ? " done" : "");
      b.innerHTML = '<span class="ck">✓</span><span></span>';
      b.lastChild.textContent = name;
      b.disabled = locked;
      b.onclick = () => toggle(id);
      box.appendChild(b);
    });
  });
  if (sel === t) {
    const f = document.createElement("button");
    f.className = "finish";
    if (state.closed[t]) { f.textContent = "Kun tugatildi ✓"; f.disabled = true; }
    else { f.textContent = "Kunni tugatish"; f.onclick = finishDay; }
    box.appendChild(f);
  }
}
function renderCal() {
  const t = todayKey();
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById("calTitle").textContent = MONTHS[m] + " " + y;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  WD.forEach(w => { const e = document.createElement("div"); e.className = "wd"; e.textContent = w; grid.appendChild(e); });
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  for (let i = 0; i < lead; i++) { const e = document.createElement("div"); e.className = "day empty"; grid.appendChild(e); }
  const days = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const k = y + "-" + pad(m + 1) + "-" + pad(d);
    const n = cnt(k);
    const b = document.createElement("button");
    b.className = "day";
    b.textContent = d;
    if (k > t) b.classList.add("future");
    else {
      if (n === N) b.classList.add("full");
      else if (n) b.style.background = "rgba(255,122,26," + (0.18 + 0.62 * n / N).toFixed(2) + ")";
      b.onclick = () => { sel = k; renderList(); renderCal(); };
    }
    if (k === t) b.classList.add("today");
    if (k === sel) b.classList.add("sel");
    grid.appendChild(b);
  }
}
function render() { renderFire(); renderList(); renderCal(); renderAuth(); }

document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); renderCal(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); renderCal(); };

/* ============ KUN ALMASHISHI ============ */
function checkDay() {
  const t = todayKey();
  if (t !== lastToday) {
    lastToday = t; sel = t; view = parseKey(t); view.setDate(1); render();
  }
}
setInterval(checkDay, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); });

/* ============ FIREBASE (ixtiyoriy) ============ */
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
function renderAuth() {
  const a = document.getElementById("auth");
  a.innerHTML = "";
  if (!FB_CONFIG.apiKey) {
    a.innerHTML = '<span class="note">Shu qurilmada saqlanadi</span>';
    return;
  }
  const b = document.createElement("button");
  b.className = "btn";
  if (fbUser) { b.textContent = "Chiqish"; b.title = fbUser.email || ""; b.onclick = () => auth.signOut(); }
  else {
    b.textContent = "Google bilan kirish";
    b.onclick = () => {
      const p = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p));
    };
  }
  a.appendChild(b);
}
async function initFirebase() {
  if (!FB_CONFIG.apiKey) return;
  const v = "10.12.2", base = "https://www.gstatic.com/firebasejs/" + v + "/firebase-";
  try {
    await loadScript(base + "app-compat.js");
    await loadScript(base + "auth-compat.js");
    await loadScript(base + "firestore-compat.js");
  } catch (e) { return; }
  firebase.initializeApp(FB_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.onAuthStateChanged(u => {
    fbUser = u;
    if (unsub) { unsub(); unsub = null; }
    if (u) {
      let first = true;
      unsub = db.collection("users").doc(u.uid).onSnapshot(snap => {
        const cloud = (snap.exists && snap.data().done) || {};
        const cloudClosed = (snap.exists && snap.data().closed) || {};
        if (first && Object.keys(state.closed).length) db.collection("users").doc(u.uid).set({ closed: state.closed }, { merge: true }).catch(() => {});
        state.closed = Object.assign({}, state.closed, cloudClosed);
        if (first) {
          first = false;
          const localOnly = {};
          Object.keys(state.done).forEach(k => { if (!(k in cloud) && state.done[k].length) localOnly[k] = state.done[k]; });
          if (Object.keys(localOnly).length) db.collection("users").doc(u.uid).set({ done: localOnly }, { merge: true }).catch(() => {});
        }
        state.done = Object.assign({}, state.done, cloud);
        persistLocal();
        render();
      }, () => {});
    }
    renderAuth();
  });
  renderAuth();
}

render();
